<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript if文 学習ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e63946;
            --secondary: #457b9d;
            --accent: #f4a261;
            --bg-dark: #1d3557;
            --bg-light: #f1faee;
            --success: #2a9d8f;
            --warning: #e9c46a;
            --code-bg: #2b2b2b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #264653 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            color: white;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 var(--primary);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .panel-header {
            background: var(--secondary);
            color: white;
            padding: 15px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-header.problem {
            background: var(--primary);
        }

        .panel-header.result {
            background: var(--success);
        }

        .panel-body {
            padding: 20px;
        }

        /* 問題表示エリア */
        .problem-box {
            background: linear-gradient(135deg, #fff9e6 0%, #fff3cd 100%);
            border-left: 5px solid var(--accent);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .problem-title {
            font-weight: 700;
            color: var(--bg-dark);
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .problem-description {
            line-height: 1.8;
            color: #555;
        }

        .highlight {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
        }

        /* コードエディタ */
        .code-editor-wrapper {
            position: relative;
        }

        .code-editor {
            width: 100%;
            min-height: 300px;
            font-family: 'Source Code Pro', monospace;
            font-size: 14px;
            background: var(--code-bg);
            color: #f8f8f2;
            border: none;
            border-radius: 10px;
            padding: 20px;
            resize: vertical;
            line-height: 1.6;
            tab-size: 2;
        }

        .code-editor:focus {
            outline: 3px solid var(--accent);
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            padding: 20px 10px;
            background: #222;
            color: #888;
            font-family: 'Source Code Pro', monospace;
            font-size: 14px;
            line-height: 1.6;
            border-radius: 10px 0 0 10px;
            user-select: none;
            text-align: right;
            min-width: 40px;
        }

        /* ボタン */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-run {
            background: linear-gradient(135deg, var(--success) 0%, #21867a 100%);
            color: white;
        }

        .btn-run:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(42, 157, 143, 0.4);
        }

        .btn-hint {
            background: linear-gradient(135deg, var(--accent) 0%, #e76f51 100%);
            color: white;
        }

        .btn-hint:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(244, 162, 97, 0.4);
        }

        .btn-reset {
            background: #ddd;
            color: #666;
        }

        .btn-reset:hover {
            background: #ccc;
        }

        .btn-answer {
            background: linear-gradient(135deg, var(--secondary) 0%, #2a6f97 100%);
            color: white;
        }

        .btn-answer:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(69, 123, 157, 0.4);
        }

        /* 結果表示 */
        .result-box {
            background: var(--code-bg);
            border-radius: 10px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Source Code Pro', monospace;
            color: #f8f8f2;
        }

        .result-output {
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* フィードバック */
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .feedback.success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border-left: 5px solid var(--success);
        }

        .feedback.error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border-left: 5px solid var(--primary);
        }

        .feedback.hint {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
            border-left: 5px solid var(--accent);
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback.success .feedback-title { color: var(--success); }
        .feedback.error .feedback-title { color: var(--primary); }
        .feedback.hint .feedback-title { color: #856404; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 問題選択 */
        .problem-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .problem-btn {
            width: 45px;
            height: 45px;
            border: 3px solid var(--secondary);
            background: white;
            border-radius: 50%;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--secondary);
        }

        .problem-btn:hover {
            background: var(--secondary);
            color: white;
        }

        .problem-btn.active {
            background: var(--secondary);
            color: white;
            transform: scale(1.1);
        }

        .problem-btn.completed {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        /* サンプルコード */
        .sample-code {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            border: 2px dashed #dee2e6;
        }

        .sample-code pre {
            font-family: 'Source Code Pro', monospace;
            font-size: 13px;
            color: #495057;
            margin: 0;
            overflow-x: auto;
        }

        /* 進捗バー */
        .progress-container {
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 5px;
            margin-top: 20px;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--success), var(--accent));
            height: 15px;
            border-radius: 15px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* アイコン */
        .icon {
            font-size: 1.2rem;
        }

        /* 世界遺産情報 */
        .heritage-info {
            background: linear-gradient(135deg, #e8f4f8 0%, #d1e8f0 100%);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .heritage-info.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .heritage-info h4 {
            color: var(--bg-dark);
            margin-bottom: 8px;
        }

        .heritage-info p {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏯 JavaScript if文 マスター道場</h1>
            <p>世界遺産クイズで楽しくif文を学ぼう！</p>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar" style="width: 0%">0%</div>
            </div>
        </header>

        <div class="main-content">
            <!-- 左パネル：問題 -->
            <div class="panel">
                <div class="panel-header problem">
                    📝 問題
                </div>
                <div class="panel-body">
                    <div class="problem-selector" id="problemSelector">
                        <!-- 動的に生成 -->
                    </div>
                    
                    <div class="problem-box" id="problemBox">
                        <!-- 動的に生成 -->
                    </div>

                    <div class="sample-code" id="sampleCode">
                        <strong>💡 if文の基本構文：</strong>
                        <pre>
if (条件1) {
    // 条件1がtrueの時の処理
} else if (条件2) {
    // 条件2がtrueの時の処理
} else {
    // どの条件も満たさない時の処理
}</pre>
                    </div>

                    <div class="code-editor-wrapper">
                        <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-run" onclick="runCode()">
                            ▶️ 実行してチェック
                        </button>
                        <button class="btn btn-hint" onclick="showHint()">
                            💡 ヒント
                        </button>
                        <button class="btn btn-answer" onclick="showAnswer()">
                            📖 解答を見る
                        </button>
                        <button class="btn btn-reset" onclick="resetCode()">
                            🔄 リセット
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右パネル：結果 -->
            <div class="panel">
                <div class="panel-header result">
                    🖥️ 実行結果
                </div>
                <div class="panel-body">
                    <div class="result-box">
                        <div class="result-output" id="resultOutput">ここに実行結果が表示されます...</div>
                    </div>

                    <div class="feedback" id="feedback">
                        <div class="feedback-title" id="feedbackTitle"></div>
                        <div class="feedback-content" id="feedbackContent"></div>
                    </div>

                    <div class="heritage-info" id="heritageInfo">
                        <!-- 動的に生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 問題データ
        const problems = [
            {
                id: 1,
                title: "レベル1：はじめてのif文",
                description: `変数 <span class="highlight">year</span> に入っている年が <span class="highlight">1995</span> なら「白川郷・五箇山の合掌造り集落」と表示するif文を完成させてください。`,
                template: `const year = 1995;
let result = "";

// ここにif文を書いてください


console.log(result);`,
                answer: `const year = 1995;
let result = "";

if (year == 1995) {
    result = "白川郷・五箇山の合掌造り集落";
}

console.log(result);`,
                expected: "白川郷・五箇山の合掌造り集落",
                hints: [
                    "if文の基本形は if (条件) { 処理 } です",
                    "条件は year == 1995 と書きます",
                    "処理部分では result = \"白川郷...\" と代入します"
                ],
                heritage: {
                    name: "白川郷・五箇山の合掌造り集落",
                    year: 1995,
                    description: "岐阜県と富山県にまたがる合掌造りの集落。急勾配の茅葺き屋根が特徴で、豪雪地帯の生活の知恵が詰まっています。"
                }
            },
            {
                id: 2,
                title: "レベル2：if-else文",
                description: `変数 <span class="highlight">year</span> が <span class="highlight">2014</span> なら「富岡製糸場と絹産業遺産群」、それ以外なら「該当なし」と表示してください。`,
                template: `const year = 2014;
let result = "";

// ここにif-else文を書いてください


console.log(result);`,
                answer: `const year = 2014;
let result = "";

if (year == 2014) {
    result = "富岡製糸場と絹産業遺産群";
} else {
    result = "該当なし";
}

console.log(result);`,
                expected: "富岡製糸場と絹産業遺産群",
                hints: [
                    "else は if の条件が false の時に実行されます",
                    "if (条件) { } else { } の形で書きます",
                    "else の後にも { } を忘れずに"
                ],
                heritage: {
                    name: "富岡製糸場と絹産業遺産群",
                    year: 2014,
                    description: "群馬県にある日本初の本格的な機械製糸工場。明治時代の殖産興業政策の象徴で、近代産業遺産として高く評価されています。"
                }
            },
            {
                id: 3,
                title: "レベル3：else if を使おう",
                description: `年によって異なる世界遺産を表示します。<br>
                <span class="highlight">1995</span>→「白川郷」<br>
                <span class="highlight">2014</span>→「富岡製糸場」<br>
                それ以外→「???」`,
                template: `const year = 2014;
let result = "";

// ここにif-else if-else文を書いてください


console.log(result);`,
                answer: `const year = 2014;
let result = "";

if (year == 1995) {
    result = "白川郷";
} else if (year == 2014) {
    result = "富岡製糸場";
} else {
    result = "???";
}

console.log(result);`,
                expected: "富岡製糸場",
                hints: [
                    "else if は複数の条件を順番にチェックできます",
                    "if → else if → else の順番で書きます",
                    "最初に true になった条件の処理だけが実行されます"
                ],
                heritage: {
                    name: "富岡製糸場と絹産業遺産群",
                    year: 2014,
                    description: "群馬県にある日本初の本格的な機械製糸工場。明治時代の殖産興業政策の象徴で、近代産業遺産として高く評価されています。"
                }
            },
            {
                id: 4,
                title: "レベル4：3つの条件分岐",
                description: `画像の例と同じように、3つの世界遺産を判定するif文を完成させてください。<br>
                <span class="highlight">1995</span>→「白川郷・五箇山の合掌造り集落」<br>
                <span class="highlight">2014</span>→「富岡製糸場と絹産業遺産群」<br>
                <span class="highlight">2021</span>→「北海道・北東北の縄文遺跡群」<br>
                それ以外→「???」`,
                template: `const year = 2021;
let result = "";

// ここにif文を完成させてください


console.log(result);`,
                answer: `const year = 2021;
let result = "";

if (year == 1995) {
    result = "白川郷・五箇山の合掌造り集落";
} else if (year == 2014) {
    result = "富岡製糸場と絹産業遺産群";
} else if (year == 2021) {
    result = "北海道・北東北の縄文遺跡群";
} else {
    result = "???";
}

console.log(result);`,
                expected: "北海道・北東北の縄文遺跡群",
                hints: [
                    "else if は何個でも追加できます",
                    "2021年のチェックを追加しましょう",
                    "条件は上から順番にチェックされます"
                ],
                heritage: {
                    name: "北海道・北東北の縄文遺跡群",
                    year: 2021,
                    description: "北海道と東北北部に分布する17の縄文時代の遺跡群。約1万5千年前から2千3百年前まで続いた縄文文化を伝える貴重な遺産です。"
                }
            },
            {
                id: 5,
                title: "チャレンジ：自由に作ろう！",
                description: `変数 <span class="highlight">year</span> を好きな値に変えて、正しい世界遺産が表示されるか確認してください。<br>
                また、新しい世界遺産を追加してみましょう！<br>
                （例：2019年→「百舌鳥・古市古墳群」）`,
                template: `const year = 2019;  // ← この値を変えてテストしよう！
let result = "";

if (year == 1995) {
    result = "白川郷・五箇山の合掌造り集落";
} else if (year == 2014) {
    result = "富岡製糸場と絹産業遺産群";
} else if (year == 2021) {
    result = "北海道・北東北の縄文遺跡群";
// ↓ ここに新しい条件を追加してみよう！

} else {
    result = "???";
}

console.log(result);`,
                answer: `const year = 2019;
let result = "";

if (year == 1995) {
    result = "白川郷・五箇山の合掌造り集落";
} else if (year == 2014) {
    result = "富岡製糸場と絹産業遺産群";
} else if (year == 2021) {
    result = "北海道・北東北の縄文遺跡群";
} else if (year == 2019) {
    result = "百舌鳥・古市古墳群";
} else {
    result = "???";
}

console.log(result);`,
                expected: "百舌鳥・古市古墳群",
                hints: [
                    "else if (year == 2019) を追加してみましょう",
                    "result = \"百舌鳥・古市古墳群\" を設定します",
                    "追加する場所は else の前です！"
                ],
                heritage: {
                    name: "百舌鳥・古市古墳群",
                    year: 2019,
                    description: "大阪府にある古墳群で、仁徳天皇陵古墳を含む49基で構成。古墳時代の政治・文化を伝える世界最大級の墳墓群です。"
                }
            }
        ];

        let currentProblem = 0;
        let completedProblems = new Set();
        let hintIndex = 0;

        // 初期化
        function init() {
            renderProblemSelector();
            loadProblem(0);
        }

        // 問題選択ボタンを生成
        function renderProblemSelector() {
            const selector = document.getElementById('problemSelector');
            selector.innerHTML = problems.map((p, i) => `
                <button class="problem-btn ${i === 0 ? 'active' : ''}" 
                        onclick="loadProblem(${i})" 
                        id="probBtn${i}">
                    ${i + 1}
                </button>
            `).join('');
        }

        // 問題を読み込み
        function loadProblem(index) {
            currentProblem = index;
            hintIndex = 0;
            const problem = problems[index];

            // ボタンの状態更新
            document.querySelectorAll('.problem-btn').forEach((btn, i) => {
                btn.classList.remove('active');
                if (i === index) btn.classList.add('active');
            });

            // 問題表示
            document.getElementById('problemBox').innerHTML = `
                <div class="problem-title">${problem.title}</div>
                <div class="problem-description">${problem.description}</div>
            `;

            // コードテンプレート
            document.getElementById('codeEditor').value = problem.template;

            // 結果・フィードバックをリセット
            document.getElementById('resultOutput').textContent = 'ここに実行結果が表示されます...';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('heritageInfo').className = 'heritage-info';
        }

        // コードを実行
        function runCode() {
            const code = document.getElementById('codeEditor').value;
            const problem = problems[currentProblem];
            let output = '';
            let isCorrect = false;

            // console.logをキャプチャ
            const originalLog = console.log;
            const logs = [];
            console.log = (...args) => {
                logs.push(args.join(' '));
            };

            try {
                eval(code);
                output = logs.join('\n');

                // 正解判定
                if (output.trim() === problem.expected) {
                    isCorrect = true;
                    completedProblems.add(currentProblem);
                    document.getElementById(`probBtn${currentProblem}`).classList.add('completed');
                    updateProgress();
                }
            } catch (error) {
                output = `❌ エラー: ${error.message}`;
            }

            console.log = originalLog;

            // 結果表示
            document.getElementById('resultOutput').textContent = output || '（出力なし）';

            // フィードバック
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackContent = document.getElementById('feedbackContent');

            if (isCorrect) {
                feedback.className = 'feedback success show';
                feedbackTitle.innerHTML = '🎉 正解！';
                feedbackContent.innerHTML = `素晴らしい！if文の使い方をマスターしていますね！`;
                
                // 世界遺産情報を表示
                const heritageInfo = document.getElementById('heritageInfo');
                heritageInfo.innerHTML = `
                    <h4>🏛️ ${problem.heritage.name}（${problem.heritage.year}年登録）</h4>
                    <p>${problem.heritage.description}</p>
                `;
                heritageInfo.className = 'heritage-info show';
            } else {
                feedback.className = 'feedback error show';
                feedbackTitle.innerHTML = '🤔 もう少し！';
                
                let advice = getAdvice(code, problem);
                feedbackContent.innerHTML = advice;
                
                document.getElementById('heritageInfo').className = 'heritage-info';
            }
        }

        // アドバイスを生成
        function getAdvice(code, problem) {
            // よくある間違いをチェック
            if (!code.includes('if')) {
                return 'if文が見つかりません。if (条件) { } の形で書いてみましょう。';
            }
            if (!code.includes('==') && !code.includes('===')) {
                return '条件式で == を使って比較していますか？例: year == 1995';
            }
            if (!code.includes('{') || !code.includes('}')) {
                return '{ } の波括弧が足りないかもしれません。';
            }
            if (code.includes('=') && !code.includes('==')) {
                return '条件式で = を1つだけ使っていませんか？比較には == を使います。';
            }
            if (!code.includes('result')) {
                return 'result変数に値を代入していますか？';
            }
            
            return `期待される出力: "${problem.expected}"<br>ヒントボタンを押してみてください！`;
        }

        // ヒントを表示
        function showHint() {
            const problem = problems[currentProblem];
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackContent = document.getElementById('feedbackContent');

            feedback.className = 'feedback hint show';
            feedbackTitle.innerHTML = `💡 ヒント ${hintIndex + 1}/${problem.hints.length}`;
            feedbackContent.innerHTML = problem.hints[hintIndex];

            hintIndex = (hintIndex + 1) % problem.hints.length;
        }

        // 解答を表示
        function showAnswer() {
            const problem = problems[currentProblem];
            document.getElementById('codeEditor').value = problem.answer;
            
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackContent = document.getElementById('feedbackContent');

            feedback.className = 'feedback hint show';
            feedbackTitle.innerHTML = '📖 解答例';
            feedbackContent.innerHTML = '解答例を表示しました。コードを読んで理解したら、実行ボタンを押してみましょう！';
        }

        // リセット
        function resetCode() {
            const problem = problems[currentProblem];
            document.getElementById('codeEditor').value = problem.template;
            document.getElementById('resultOutput').textContent = 'ここに実行結果が表示されます...';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('heritageInfo').className = 'heritage-info';
            hintIndex = 0;
        }

        // 進捗更新
        function updateProgress() {
            const progress = (completedProblems.size / problems.length) * 100;
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${progress}%`;
            progressBar.textContent = `${Math.round(progress)}%`;

            if (completedProblems.size === problems.length) {
                setTimeout(() => {
                    alert('🎊 おめでとうございます！全問クリアです！\nif文マスターになりました！');
                }, 500);
            }
        }

        // 初期化実行
        init();
    </script>
</body>
</html>
