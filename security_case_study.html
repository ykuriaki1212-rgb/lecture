<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情報セキュリティ ケーススタディ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .progress-bar {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #00b894, #00cec9);
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .progress-text {
            color: #fff;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .case-badge {
            display: inline-block;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .case-title {
            font-size: 1.3rem;
            color: #2d3436;
            line-height: 1.8;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid #6c5ce7;
            margin-bottom: 25px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 18px 25px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #6c5ce7;
            background: #f8f5ff;
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            border-color: #00b894;
            background: #e8f8f5;
        }

        .option-btn.wrong {
            border-color: #e74c3c;
            background: #fdf2f2;
        }

        .option-btn.best {
            border-color: #00b894;
            background: #d4f8e8;
            box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.2);
        }

        .option-letter {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #6c5ce7;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .result-panel {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        }

        .result-panel.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .score-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .score-number {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            color: #636e72;
            font-size: 1rem;
        }

        .model-answer {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #00b894;
        }

        .model-answer h4 {
            color: #00b894;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-answer p {
            line-height: 1.8;
            color: #2d3436;
        }

        .next-btn {
            display: none;
            width: 100%;
            padding: 18px;
            margin-top: 20px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
        }

        .next-btn.show {
            display: block;
        }

        /* 最終結果画面 */
        .final-result {
            display: none;
            text-align: center;
        }

        .final-result.show {
            display: block;
        }

        .final-score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4);
        }

        .final-score-number {
            font-size: 3.5rem;
            font-weight: bold;
            color: #fff;
        }

        .final-score-text {
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
        }

        .final-message {
            font-size: 1.5rem;
            color: #2d3436;
            margin: 20px 0;
        }

        .score-breakdown {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            text-align: left;
        }

        .score-breakdown h4 {
            margin-bottom: 15px;
            color: #6c5ce7;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .breakdown-item:last-child {
            border-bottom: none;
        }

        .retry-btn {
            padding: 18px 50px;
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 184, 148, 0.4);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 情報セキュリティ ケーススタディ</h1>
            <p>各ケースで最も適切な対応を選んでください</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">ケース 1 / 4</div>
        </div>

        <div class="card">
            <!-- ケース表示エリア -->
            <div id="quizArea">
                <div class="case-badge" id="caseBadge">ケース 1</div>
                <div class="case-title" id="caseTitle"></div>
                <div class="options" id="optionsContainer"></div>
                
                <div class="result-panel" id="resultPanel">
                    <div class="score-display">
                        <div class="score-number" id="scoreDisplay">0点</div>
                        <div class="score-label">今回のスコア</div>
                    </div>
                    <div class="model-answer">
                        <h4>💡 模範解答・解説</h4>
                        <p id="modelAnswer"></p>
                    </div>
                </div>
                
                <button class="next-btn" id="nextBtn">次のケースへ →</button>
            </div>

            <!-- 最終結果エリア -->
            <div class="final-result" id="finalResult">
                <h2>🎉 全ケース終了！</h2>
                <div class="final-score-circle">
                    <div class="final-score-number" id="finalScore">0</div>
                    <div class="final-score-text">/ 400点</div>
                </div>
                <div class="final-message" id="finalMessage"></div>
                <div class="score-breakdown">
                    <h4>📊 ケース別スコア</h4>
                    <div id="breakdownList"></div>
                </div>
                <button class="retry-btn" onclick="location.reload()">もう一度挑戦する</button>
            </div>
        </div>
    </div>

    <script>
        // ケースデータ
        const cases = [
            {
                id: 1,
                title: '取引先から「見積書を至急メールで」と電話があった。顧客情報入りのエクセルを添付しそうになった。',
                options: [
                    { text: '急いでいるので、そのまま添付して送信する', score: 0 },
                    { text: '顧客情報を削除・別シートに分離してから送信する', score: 100 },
                    { text: '上司に確認してから対応する', score: 70 },
                    { text: 'パスワードを付けて、そのまま送信する', score: 40 }
                ],
                bestIndex: 1,
                modelAnswer: '【正解】顧客情報を削除・別シートに分離してから送信する（100点）\n\n見積書に顧客情報は本来不要です。「急ぎ」という言葉に惑わされず、必要な情報だけを送信することが重要です。個人情報を含むファイルをそのまま送信すると、情報漏えいのリスクがあります。送信前に必ず添付ファイルの内容を確認し、不要な情報は削除してから送信しましょう。'
            },
            {
                id: 2,
                title: '退職予定の同僚が、最終日に「お世話になった取引先に挨拶したい」と顧客リストを見せてほしいと言ってきた。',
                options: [
                    { text: '長年の付き合いなので、見せてあげる', score: 0 },
                    { text: '上司に相談してから対応する', score: 100 },
                    { text: '必要な連絡先だけメモで渡してあげる', score: 20 },
                    { text: '「会社のルールだから」とはっきり断る', score: 80 }
                ],
                bestIndex: 1,
                modelAnswer: '【正解】上司に相談してから対応する（100点）\n\n退職予定者への情報提供は、たとえ善意の理由であっても情報漏えいリスクになります。顧客情報は会社の重要な資産であり、業務上の必要性がない人には見せてはいけません。このような場合は自己判断せず、必ず上司に相談して組織として適切に対応することが重要です。退職後に競合他社へ転職する可能性もあります。'
            },
            {
                id: 3,
                title: '現場で撮影した墓石の写真が私物スマホに300枚溜まっている。転送するのが面倒。',
                options: [
                    { text: 'そのまま私物スマホに保存しておく', score: 0 },
                    { text: '面倒でも会社のルールに従って転送・削除する', score: 100 },
                    { text: '時間があるときにまとめて対応する', score: 40 },
                    { text: '個人のクラウド（GoogleドライブやiCloud）にバックアップしておく', score: 10 }
                ],
                bestIndex: 1,
                modelAnswer: '【正解】面倒でも会社のルールに従って転送・削除する（100点）\n\n私物スマホに業務データを保管することは大きなリスクです。スマホの紛失・盗難、ウイルス感染、退職時の情報持ち出しなど、様々な問題が発生する可能性があります。墓石の写真には故人様やご遺族の個人情報が含まれている可能性もあります。面倒でも速やかに会社指定の方法で転送し、私物からは削除することが必要です。'
            },
            {
                id: 4,
                title: 'FAXで拠点に送信した顧客情報が、間違えて別の会社に送信されてしまった。',
                options: [
                    { text: '気づかなかったことにして黙っておく', score: 0 },
                    { text: 'すぐに上司に報告し、対応を相談する', score: 100 },
                    { text: '誤送信先に自分で電話して削除をお願いする', score: 60 },
                    { text: '次から気をつければ大丈夫だと考える', score: 10 }
                ],
                bestIndex: 1,
                modelAnswer: '【正解】すぐに上司に報告し、対応を相談する（100点）\n\n情報漏えいが発生した場合、隠蔽は絶対にNGです。被害を最小限に抑えるためには、迅速な報告と組織的な対応が不可欠です。自己判断で誤送信先に連絡することも、状況を悪化させる可能性があります。上司に報告し、会社として誤送信先への削除依頼、お客様への謝罪、再発防止策の検討などを行う必要があります。'
            }
        ];

        let currentCase = 0;
        let scores = [];
        let answered = false;

        // 初期化
        function init() {
            showCase(0);
        }

        // ケースを表示
        function showCase(index) {
            const caseData = cases[index];
            answered = false;
            
            document.getElementById('caseBadge').textContent = `ケース ${caseData.id}`;
            document.getElementById('caseTitle').textContent = caseData.title;
            document.getElementById('progressText').textContent = `ケース ${index + 1} / ${cases.length}`;
            document.getElementById('progressFill').style.width = `${(index / cases.length) * 100}%`;
            
            // 選択肢を生成
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            
            caseData.options.forEach((option, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="option-letter">${letters[i]}</span>
                    <span>${option.text}</span>
                `;
                btn.onclick = () => selectOption(i);
                container.appendChild(btn);
            });
            
            // 結果パネルを隠す
            document.getElementById('resultPanel').classList.remove('show');
            document.getElementById('nextBtn').classList.remove('show');
        }

        // 選択肢を選んだとき
        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;
            
            const caseData = cases[currentCase];
            const score = caseData.options[selectedIndex].score;
            scores.push(score);
            
            // ボタンの状態を更新
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === caseData.bestIndex) {
                    btn.classList.add('best');
                } else if (i === selectedIndex) {
                    btn.classList.add('wrong');
                }
            });
            
            // 結果を表示
            document.getElementById('scoreDisplay').textContent = `${score}点`;
            document.getElementById('modelAnswer').innerHTML = caseData.modelAnswer.replace(/\n/g, '<br>');
            document.getElementById('resultPanel').classList.add('show');
            
            // 次へボタンを表示
            const nextBtn = document.getElementById('nextBtn');
            if (currentCase < cases.length - 1) {
                nextBtn.textContent = '次のケースへ →';
            } else {
                nextBtn.textContent = '結果を見る →';
            }
            nextBtn.classList.add('show');
        }

        // 次のケースへ
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentCase++;
            if (currentCase < cases.length) {
                showCase(currentCase);
            } else {
                showFinalResult();
            }
        });

        // 最終結果を表示
        function showFinalResult() {
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('finalResult').classList.add('show');
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressText').textContent = '完了！';
            
            const totalScore = scores.reduce((a, b) => a + b, 0);
            document.getElementById('finalScore').textContent = totalScore;
            
            // 評価メッセージ
            let message = '';
            if (totalScore === 400) {
                message = '🏆 パーフェクト！セキュリティ意識が素晴らしいです！';
            } else if (totalScore >= 300) {
                message = '👏 優秀です！基本的な対応ができています。';
            } else if (totalScore >= 200) {
                message = '📚 もう一度ルールを確認しましょう。';
            } else {
                message = '⚠️ 要注意！情報セキュリティ研修を受けましょう。';
            }
            document.getElementById('finalMessage').textContent = message;
            
            // ケース別スコア
            const breakdownList = document.getElementById('breakdownList');
            breakdownList.innerHTML = '';
            scores.forEach((score, i) => {
                const item = document.createElement('div');
                item.className = 'breakdown-item';
                item.innerHTML = `
                    <span>ケース ${i + 1}</span>
                    <span style="font-weight: bold; color: ${score === 100 ? '#00b894' : score >= 60 ? '#fdcb6e' : '#e74c3c'}">${score}点</span>
                `;
                breakdownList.appendChild(item);
            });
            
            // 合計行
            const totalItem = document.createElement('div');
            totalItem.className = 'breakdown-item';
            totalItem.style.borderTop = '2px solid #6c5ce7';
            totalItem.style.marginTop = '10px';
            totalItem.style.paddingTop = '15px';
            totalItem.innerHTML = `
                <span style="font-weight: bold;">合計</span>
                <span style="font-weight: bold; color: #6c5ce7; font-size: 1.2rem;">${totalScore}点 / 400点</span>
            `;
            breakdownList.appendChild(totalItem);
        }

        // 開始
        init();
    </script>
</body>
</html>
