<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何が出るかな？ルーレット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .roulette-section {
            margin-bottom: 30px;
        }

        .roulette-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 30px;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff6b6b;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
            z-index: 10;
        }

        #rouletteSVG {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.2));
            transition: transform 0.05s linear;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #667eea;
            font-size: 0.9em;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .sound-toggle {
            background: #fff;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 20px;
            font-size: 1.2em;
        }

        .result {
            text-align: center;
            font-size: 1.5em;
            margin-top: 20px;
            min-height: 50px;
            color: #667eea;
        }

        .winner {
            animation: celebrate 0.6s ease-in-out;
            font-weight: bold;
            font-size: 2em;
            color: #f5576c;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .items-section {
            margin-top: 30px;
        }

        .items-section h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .item-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .item-input-group input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
        }

        .item-input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-button {
            background: #4caf50;
            padding: 10px 25px;
            font-size: 1em;
        }

        .preset-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .preset-btn {
            background: #eef1ff;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 16px;
            font-size: 0.9em;
            border-radius: 20px;
            margin: 0;
            box-shadow: none;
        }

        .preset-btn:hover {
            background: #667eea;
            color: #fff;
            transform: none;
            box-shadow: none;
        }

        .items-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .item-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-tag .remove {
            cursor: pointer;
            font-weight: bold;
            background: rgba(255,255,255,0.3);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .item-tag .remove:hover {
            background: rgba(255,255,255,0.5);
        }

        /* ===== エクスポート / インポート ===== */
        .io-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }

        .io-section h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .io-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .io-buttons button {
            font-size: 1em;
            padding: 12px 25px;
            margin: 0;
        }

        .export-button {
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
        }

        .import-button {
            background: linear-gradient(135deg, #fb8c00 0%, #ef6c00 100%);
        }

        .io-message {
            margin-top: 12px;
            font-size: 0.95em;
            min-height: 1.3em;
        }

        .io-message.success { color: #2e7d32; }
        .io-message.error { color: #c62828; }

        /* ===== 紙吹雪 ===== */
        .confetti-piece {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 16px;
            z-index: 100;
            pointer-events: none;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.8;
            }
        }

        @media (max-width: 600px) {
            .roulette-container {
                width: 300px;
                height: 300px;
            }

            h1 {
                font-size: 1.5em;
            }

            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 何が出るかな？ルーレット 🎰</h1>

        <div class="roulette-section">
            <div class="roulette-container">
                <div class="pointer"></div>
                <svg id="rouletteSVG" viewBox="0 0 400 400"></svg>
                <div class="center-circle">SPIN</div>
            </div>

            <div class="controls">
                <button id="startButton">START</button>
                <button id="stopButton" disabled>STOP</button>
                <button id="soundToggle" class="sound-toggle" title="効果音のON/OFF">🔊</button>
            </div>

            <div class="result" id="result"></div>
        </div>

        <div class="items-section">
            <h2>項目設定</h2>
            <div class="preset-buttons">
                <button class="preset-btn" data-preset="topics">🎯 セキュリティお題</button>
                <button class="preset-btn" data-preset="names">🙋 指名（1〜9番）</button>
                <button class="preset-btn" data-preset="yesno">⭕ 二択（YES / NO）</button>
                <button class="preset-btn" data-preset="aiueo">🔤 あ〜そ（15）</button>
            </div>
            <div class="item-input-group">
                <input type="text" id="itemInput" placeholder="項目名を入力してEnterキーで追加">
                <button class="add-button" id="addButton">追加</button>
            </div>
            <div class="items-list" id="itemsList"></div>
        </div>

        <div class="io-section">
            <h2>設定の保存・読み込み</h2>
            <div class="io-buttons">
                <button class="export-button" id="exportButton">📤 エクスポート（JSON）</button>
                <button class="import-button" id="importButton">📥 インポート（JSON）</button>
                <input type="file" id="importFile" accept=".json,application/json" style="display:none">
            </div>
            <div class="io-message" id="ioMessage"></div>
        </div>
    </div>

    <script>
        let items = ['ランサムウェア', 'BEC（ビジネスメール詐欺）', 'サプライチェーン攻撃', '内部不正・情報持ち出し', 'なりすまし・偽サイト', 'パスワード管理'];
        let isSpinning = false;
        let currentRotation = 0;
        let animationId;
        let speed = 0;
        const maxSpeed = 30;
        const acceleration = 1.5;
        const deceleration = 0.3;

        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];

        /* ============================================================
           音声演出（Web Audio API）
           外部ファイル不要。回転中のカチカチ音、加減速に合わせた
           ピッチ変化、当選時のファンファーレ＋歓声風ノイズを合成。
           ============================================================ */
        let audioCtx = null;
        let soundEnabled = true;
        let lastTickSegment = -1;
        let lastTickTime = 0;
        const minTickInterval = 110; // カチ音の最短間隔(ms)。大きくするほどゆっくり

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // 回転中のカチッという音（速度に応じてピッチが緩やかに変化）
        function playTick() {
            if (!soundEnabled) return;
            const nowMs = performance.now();
            if (nowMs - lastTickTime < minTickInterval) return; // 鳴らしすぎ防止
            lastTickTime = nowMs;

            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const now = ctx.currentTime;

            const pitch = 450 + (speed / maxSpeed) * 300; // 変化を控えめに
            osc.type = 'square';
            osc.frequency.setValueAtTime(pitch, now);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.connect(gain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.09);
        }

        // スタート時のスウィープ音（テンションを上げる）
        function playStartSweep() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const now = ctx.currentTime;

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 1.0);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);

            osc.connect(gain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 1.2);
        }

        // ドラムロール風（STOP後、止まるまでの緊張感）
        let drumrollTimer = null;
        function startDrumroll() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            stopDrumroll();
            drumrollTimer = setInterval(() => {
                const now = ctx.currentTime;
                const bufferSize = ctx.sampleRate * 0.03;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
                }
                const src = ctx.createBufferSource();
                const gain = ctx.createGain();
                src.buffer = buffer;
                gain.gain.setValueAtTime(0.08, now);
                src.connect(gain).connect(ctx.destination);
                src.start(now);
            }, 100);
        }

        function stopDrumroll() {
            if (drumrollTimer) {
                clearInterval(drumrollTimer);
                drumrollTimer = null;
            }
        }

        // 当選ファンファーレ（ド・ミ・ソ・ド↑）＋シャラーン
        function playFanfare() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6

            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const t = now + i * 0.3; // ゆったりしたテンポ
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.exponentialRampToValueAtTime(0.22, t + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, t + (i === notes.length - 1 ? 1.4 : 0.45));
                osc.connect(gain).connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 1.6);
            });

            // 最後の和音（C6 + E6 + G6）
            [1046.5, 1318.5, 1568.0].forEach(freq => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const t = now + 1.1;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.exponentialRampToValueAtTime(0.12, t + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
                osc.connect(gain).connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 1.3);
            });

            // 歓声風のホワイトノイズ（シャーッ）
            const bufferSize = ctx.sampleRate * 1.2;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }
            const src = ctx.createBufferSource();
            const noiseGain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 3000;
            src.buffer = buffer;
            noiseGain.gain.setValueAtTime(0.08, now + 1.0);
            src.connect(filter).connect(noiseGain).connect(ctx.destination);
            src.start(now + 1.0);
        }

        // 回転角度からセグメント境界を跨いだらカチッと鳴らす
        function tickIfCrossed() {
            const angleStep = 360 / items.length;
            const seg = Math.floor(((currentRotation % 360) + 360) % 360 / angleStep);
            if (seg !== lastTickSegment) {
                lastTickSegment = seg;
                playTick();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
            if (!soundEnabled) stopDrumroll();
        }

        /* ============================================================
           紙吹雪演出
           ============================================================ */
        function launchConfetti() {
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (2 + Math.random() * 2) + 's';
                piece.style.animationDelay = (Math.random() * 0.4) + 's';
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 4500);
            }
        }

        /* ============================================================
           エクスポート / インポート（JSON）
           ============================================================ */
        function showIoMessage(text, type) {
            const el = document.getElementById('ioMessage');
            el.textContent = text;
            el.className = 'io-message ' + type;
            setTimeout(() => {
                el.textContent = '';
                el.className = 'io-message';
            }, 4000);
        }

        function exportSettings() {
            const settings = {
                app: 'roulette',
                version: 1,
                exportedAt: new Date().toISOString(),
                items: items
            };
            const blob = new Blob([JSON.stringify(settings, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const stamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `roulette-settings-${stamp}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showIoMessage('✅ 設定をJSONファイルとして保存しました', 'success');
        }

        function importSettings(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);

                    // 検証：items配列（文字列のみ・2件以上）
                    let importedItems = null;
                    if (Array.isArray(parsed)) {
                        importedItems = parsed; // 素の配列形式にも対応
                    } else if (parsed && Array.isArray(parsed.items)) {
                        importedItems = parsed.items;
                    }

                    if (!importedItems) {
                        throw new Error('items配列が見つかりません');
                    }

                    const cleaned = importedItems
                        .filter(v => typeof v === 'string' || typeof v === 'number')
                        .map(v => String(v).trim())
                        .filter(v => v.length > 0);

                    if (cleaned.length < 2) {
                        throw new Error('有効な項目が2つ以上必要です');
                    }

                    items = cleaned;
                    renderItems();
                    showIoMessage(`✅ ${cleaned.length}件の項目を読み込みました`, 'success');
                } catch (err) {
                    showIoMessage('❌ 読み込みに失敗しました：' + err.message, 'error');
                }
            };
            reader.onerror = function() {
                showIoMessage('❌ ファイルの読み込みに失敗しました', 'error');
            };
            reader.readAsText(file, 'UTF-8');
        }

        /* ============================================================
           ルーレット本体
           ============================================================ */
        function renderItems() {
            const itemsList = document.getElementById('itemsList');
            itemsList.innerHTML = '';
            items.forEach((item, index) => {
                const tag = document.createElement('div');
                tag.className = 'item-tag';

                const span = document.createElement('span');
                span.textContent = item;

                const remove = document.createElement('div');
                remove.className = 'remove';
                remove.setAttribute('data-index', index);
                remove.textContent = '×';

                tag.appendChild(span);
                tag.appendChild(remove);
                itemsList.appendChild(tag);
            });
            renderRoulette();
        }

        function addItem() {
            const input = document.getElementById('itemInput');
            const value = input.value.trim();
            if (value && !isSpinning) {
                items.push(value);
                input.value = '';
                renderItems();
            }
        }

        function removeItem(index) {
            if (!isSpinning && items.length > 2) {
                items.splice(index, 1);
                renderItems();
            } else if (items.length <= 2) {
                alert('項目は最低2つ必要です');
            }
        }

        // ルーレットのラベルを扇内に収めるため複数行に分割
        // 「・」の後・「（」の前で改行し、長い部分はさらに文字数で折り返す
        function wrapLabel(text) {
            const marked = text.replace(/・/g, '・\n').replace(/（/g, '\n（');
            const maxLen = 6;
            const lines = [];
            marked.split('\n').forEach(seg => {
                seg = seg.trim();
                if (!seg) return;
                for (let i = 0; i < seg.length; i += maxLen) {
                    lines.push(seg.substring(i, i + maxLen));
                }
            });
            return lines.length ? lines : [text];
        }

        function renderRoulette() {
            const svg = document.getElementById('rouletteSVG');
            svg.innerHTML = '';

            const centerX = 200;
            const centerY = 200;
            const radius = 180;
            const angleStep = (2 * Math.PI) / items.length;

            items.forEach((item, index) => {
                // 最初の項目が真上(ポインター位置)に来るように調整
                const startAngle = angleStep * index;
                const endAngle = startAngle + angleStep;

                // 扇形のパスを作成
                const x1 = centerX + radius * Math.cos(startAngle);
                const y1 = centerY + radius * Math.sin(startAngle);
                const x2 = centerX + radius * Math.cos(endAngle);
                const y2 = centerY + radius * Math.sin(endAngle);

                const largeArcFlag = angleStep > Math.PI ? 1 : 0;

                const pathData = [
                    `M ${centerX} ${centerY}`,
                    `L ${x1} ${y1}`,
                    `A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2}`,
                    'Z'
                ].join(' ');

                // 扇形を作成
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('fill', colors[index % colors.length]);
                path.setAttribute('stroke', 'white');
                path.setAttribute('stroke-width', '2');
                svg.appendChild(path);

                // テキストの位置（扇形の中央）
                const textAngle = startAngle + angleStep / 2;
                const textRadius = radius * 0.65;
                const textX = centerX + textRadius * Math.cos(textAngle);
                const textY = centerY + textRadius * Math.sin(textAngle);

                // テキストを作成（長い項目は複数行に折り返して扇内に収める）
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', textX);
                text.setAttribute('y', textY);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'middle');
                text.setAttribute('fill', 'white');
                text.setAttribute('font-size', '15');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('transform', `rotate(${(textAngle + Math.PI / 2) * 180 / Math.PI}, ${textX}, ${textY})`);

                const labelLines = wrapLabel(item);
                const lineHeight = 14;
                labelLines.forEach((line, li) => {
                    const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                    tspan.setAttribute('x', textX);
                    tspan.setAttribute('dy', li === 0 ? -(labelLines.length - 1) * lineHeight / 2 : lineHeight);
                    tspan.textContent = line;
                    text.appendChild(tspan);
                });
                svg.appendChild(text);
            });
        }

        function startRoulette() {
            if (items.length < 2) {
                alert('項目を2つ以上追加してください');
                return;
            }

            isSpinning = true;
            speed = 0;
            lastTickSegment = -1;
            document.getElementById('startButton').disabled = true;
            document.getElementById('stopButton').disabled = false;
            document.getElementById('result').innerHTML = '';

            playStartSweep();

            function accelerate() {
                if (speed < maxSpeed) {
                    speed += acceleration;
                }
                currentRotation += speed;
                document.getElementById('rouletteSVG').style.transform = `rotate(${currentRotation}deg)`;
                tickIfCrossed();
                animationId = requestAnimationFrame(accelerate);
            }
            accelerate();
        }

        function stopRoulette() {
            document.getElementById('stopButton').disabled = true;
            cancelAnimationFrame(animationId);
            startDrumroll();

            function decelerate() {
                speed -= deceleration;
                if (speed <= 0) {
                    speed = 0;
                    isSpinning = false;
                    stopDrumroll();
                    document.getElementById('startButton').disabled = false;
                    showWinner();
                    return;
                }
                currentRotation += speed;
                document.getElementById('rouletteSVG').style.transform = `rotate(${currentRotation}deg)`;
                tickIfCrossed();
                animationId = requestAnimationFrame(decelerate);
            }
            decelerate();
        }

        function showWinner() {
            // 現在の回転角度を0-360の範囲に正規化
            const normalizedRotation = ((currentRotation % 360) + 360) % 360;
            const angleStep = 360 / items.length;

            // ポインターは真上(270度の位置)にあり、ルーレットは時計回りに回転
            // 真上から見て、どのセグメントが来ているかを計算
            // 0度は右方向、270度が上方向なので、270度を基準に調整
            const pointerAngle = 270;
            const adjustedAngle = (pointerAngle - normalizedRotation + 360) % 360;

            // どのセグメントにポインターが指しているかを計算
            const winnerIndex = Math.floor(adjustedAngle / angleStep) % items.length;
            const winner = items[winnerIndex];

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';
            const winnerDiv = document.createElement('div');
            winnerDiv.className = 'winner';
            winnerDiv.textContent = `🎉 ${winner} 🎉`;
            resultDiv.appendChild(winnerDiv);

            playFanfare();
            launchConfetti();
        }

        // Enterキーで項目追加
        document.getElementById('itemInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addItem();
            }
        });

        // ボタンのイベントリスナー
        document.getElementById('startButton').addEventListener('click', startRoulette);
        document.getElementById('stopButton').addEventListener('click', stopRoulette);
        document.getElementById('addButton').addEventListener('click', addItem);
        document.getElementById('soundToggle').addEventListener('click', toggleSound);

        // エクスポート / インポート
        document.getElementById('exportButton').addEventListener('click', exportSettings);
        document.getElementById('importButton').addEventListener('click', function() {
            if (isSpinning) return;
            document.getElementById('importFile').click();
        });
        document.getElementById('importFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) importSettings(file);
            e.target.value = ''; // 同じファイルを再選択可能に
        });

        // 削除ボタンのイベント委譲
        document.getElementById('itemsList').addEventListener('click', function(e) {
            if (e.target.classList.contains('remove')) {
                const index = parseInt(e.target.getAttribute('data-index'));
                removeItem(index);
            }
        });

        // プリセット（研修用）
        const presets = {
            topics: ['ランサムウェア', 'BEC（ビジネスメール詐欺）', 'サプライチェーン攻撃', '内部不正・情報持ち出し', 'なりすまし・偽サイト', 'パスワード管理'],
            names: ['1番', '2番', '3番', '4番', '5番', '6番', '7番', '8番', '9番'],
            yesno: ['YES', 'NO'],
            aiueo: ['あ', 'い', 'う', 'え', 'お', 'か', 'き', 'く', 'け', 'こ', 'さ', 'し', 'す', 'せ', 'そ']
        };
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (isSpinning) return;
                items = presets[this.dataset.preset].slice();
                renderItems();
                showIoMessage('✅ プリセットを読み込みました', 'success');
            });
        });

        // 初期表示
        renderItems();
    </script>
</body>
</html>
